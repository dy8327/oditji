# 운영 환경
server.port=8080
server.servlet.context-path=/oditji
server.forward-headers-strategy=framework
server.servlet.session.persistent=false

# Oracle DB
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Linux 파일 저장 경로
oditji.upload.product-path=/opt/oditji/uploads/product
oditji.upload.profile-path=/opt/oditji/uploads/profile
oditji.upload.event-path=/opt/oditji/uploads/event
oditji.upload.business-license-path=/opt/oditji/uploads/business-license

# 검색 캐시 파일 경로
search.content-cache.snapshot-path=/opt/oditji/cache/search-content-cache.jsonl
search.content-cache.manual-platform-override-path=/opt/oditji/cache/manual-platform-overrides.json
search.content-cache.manual-age-rating-override-path=/opt/oditji/cache/manual-age-rating-overrides.json
search.content-cache.missing-age-rating-path=/opt/oditji/cache/missing-age-rating-candidates.json

# 운영 서버 주소
app.base-url=${APP_BASE_URL:http://localhost:8080/oditji}

# Kakao Login
kakao.client-id=${KAKAO_CLIENT_ID:}
kakao.client-secret=${KAKAO_CLIENT_SECRET:}
kakao.redirect-uri=${APP_BASE_URL:http://localhost:8080/oditji}/member/kakao/callback

# Naver Login
naver.client-id=${NAVER_CLIENT_ID:}
naver.client-secret=${NAVER_CLIENT_SECRET:}
naver.redirect-uri=${APP_BASE_URL:http://localhost:8080/oditji}/member/naver/callback

# Google Login
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
google.redirect-uri=${APP_BASE_URL:http://localhost:8080/oditji}/member/google/callback

# TMDB API
tmdb.api.base-url=https://api.themoviedb.org/3
tmdb.api.token=${TMDB_API_TOKEN:}
tmdb.api.image-base-url=https://image.tmdb.org/t/p/w500
tmdb.api.language=ko-KR
tmdb.api.region=KR

# PortOne
portone.store-id=${PORTONE_STORE_ID:}
portone.api-secret=${PORTONE_API_SECRET:}
portone.identity1.channel-key=${PORTONE_IDENTITY1_CHANNEL_KEY:}
portone.identity2.channel-key=${PORTONE_IDENTITY2_CHANNEL_KEY:}
portone.payment.channel-key=${PORTONE_PAYMENT_CHANNEL_KEY:}
portone.payment.test-mode=${PORTONE_PAYMENT_TEST_MODE:true}

# 국세청 사업자 인증
nts.business.service-key=${NTS_BUSINESS_SERVICE_KEY:}

# Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.localhost=oditji-server
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.default-encoding=UTF-8

# 운영 오류정보 차단
spring.web.error.include-exception=false
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never
# =========================================================
# Firebase 관리자·사업자 채팅 인증
# =========================================================
# true로 전환하기 전에 GOOGLE_APPLICATION_CREDENTIALS 환경변수에
# Firebase 서비스 계정 JSON의 절대 경로를 등록해야 합니다.
firebase.chat.enabled=${FIREBASE_CHAT_ENABLED:false}
firebase.chat.project-id=${FIREBASE_PROJECT_ID:app24-db038}

