spring.application.name=oditji

server.port=8080
server.servlet.context-path=/oditji
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
spring.datasource.username=SYSTEM
spring.datasource.password=

mybatis.mapper-locations=classpath:/mybatis/mappers/**/*.xml
mybatis.type-aliases-package=com.project.oditji
mybatis.configuration.map-underscore-to-camel-case=true

# 파일 업로드 용량 설정
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# PortOne V2 Credentials 공통
portone.store-id=
portone.api-secret=

# 본인간편인증 채널
portone.identity1.channel-key=

# 결제 채널
portone.payment.channel-key=

# 본인SMS인증 채널
portone.identity2.channel-key=

# Kakao Login
kakao.client_id=
kakao.client_secret=
kakao.redirect_uri=http://localhost:8080/oditji/member/kakao/callback


# TMDB API settings
# Put the TMDB API Read Access Token here for local testing.
# Do not commit a real token to a public repository.
tmdb.api.base-url=https://api.themoviedb.org/3
tmdb.api.token=
tmdb.api.image-base-url=https://image.tmdb.org/t/p/w500
tmdb.api.language=ko-KR
tmdb.api.region=KR
